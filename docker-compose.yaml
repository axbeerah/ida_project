x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
  AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "120"
  AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "120"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
  AIRFLOW__WEBSERVER__WEB_SERVER_HOST: "0.0.0.0"
  AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
  AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
  AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "0"
  AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "0"
  AIRFLOW__WEBSERVER__SECRET_KEY: "pharma-sdi-local-secret-key"
  PHARMA_DWH_HOME: /opt/airflow/project
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharma-sdi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ida_project_postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build: .
    image: pharma-sdi-airflow:2.10.5
    container_name: pharma-sdi-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes:
      - ./:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname SDI --lastname Admin --role Admin --email admin@example.com || true)"

  airflow-webserver:
    image: pharma-sdi-airflow:2.10.5
    container_name: pharma-sdi-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./:/opt/airflow/project
    ports:
      - "8081:8080"
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid &&
      exec airflow webserver -w 1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    image: pharma-sdi-airflow:2.10.5
    container_name: pharma-sdi-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./:/opt/airflow/project
    command: airflow scheduler

volumes:
  ida_project_postgres-db-volume: