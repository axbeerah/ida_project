services:
  postgres:
    image: postgres:15-alpine
    container_name: pharma-sdi-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build: .
    image: pharma-sdi-airflow:2.10.5
    container_name: pharma-sdi-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: "0.0.0.0"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      PHARMA_DWH_HOME: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname SDI --lastname Admin --role Admin --email admin@example.com || true) &&
      airflow webserver & airflow scheduler"

volumes:
  postgres-db-volume: